spring:
  config:
    import: "optional:file:${ENV_FILE:.env}[.properties]"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  application:
    name: collabnote
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  messages:
    basename: messages
    fallback-to-system-locale: false
  mvc:
    problemdetails:
      enabled: false
  servlet:
    multipart:
      enabled: false
server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
logging:
  level:
    root: INFO
    com.collabnote: INFO
  pattern:
    level: '%5p [requestId=%X{requestId}]'
collabnote:
  auth:
    jwt-secret: ${AUTH_JWT_SECRET}
    issuer: ${AUTH_JWT_ISSUER:collabnote}
    audience: ${AUTH_JWT_AUDIENCE:collabnote-api}
    access-ttl: ${AUTH_ACCESS_TTL:15m}
    session-ttl: ${AUTH_SESSION_TTL:7d}
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    mail-enabled: ${AUTH_MAIL_ENABLED:false}
    mail-from: ${AUTH_MAIL_FROM:noreply@localhost}
    verification-url: ${AUTH_VERIFICATION_URL:http://localhost:3000/verify-email}
    reset-url: ${AUTH_RESET_URL:http://localhost:3000/reset-password}
    google-client-id: ${GOOGLE_CLIENT_ID:}
  web:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
